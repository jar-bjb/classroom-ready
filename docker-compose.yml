services:
  db:
    image: postgres:16-alpine
    container_name: classroom-ready-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-classroom_ready}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classroom_ready_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-classroom_ready}
    volumes:
      - classroom_ready_pg:/var/lib/postgresql/data
    ports:
      - "${CLASSROOM_DB_BIND:-127.0.0.1:55438}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    container_name: classroom-ready-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://classroom_ready:classroom_ready_dev_change_me@db:5432/classroom_ready?schema=public}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://127.0.0.1:3020}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      PORT: ${PORT:-3000}
      HOSTNAME: ${HOSTNAME:-0.0.0.0}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    volumes:
      - classroom_ready_uploads:/app/uploads
    ports:
      - "${CLASSROOM_APP_BIND:-127.0.0.1:3020}:3000"

volumes:
  classroom_ready_pg:
  classroom_ready_uploads:
