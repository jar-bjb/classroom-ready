services:
  db:
    image: postgres:16-alpine
    container_name: classroom-ready-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: classroom_ready
      POSTGRES_PASSWORD: classroom_ready_dev
      POSTGRES_DB: classroom_ready
    volumes:
      - classroom_ready_pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classroom_ready -d classroom_ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: classroom-ready-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://classroom_ready:classroom_ready_dev@db:5432/classroom_ready?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      UPLOAD_DIR: /app/uploads
      PORT: 3000
      HOSTNAME: 0.0.0.0
    volumes:
      - classroom_ready_uploads:/app/uploads
    ports:
      - "127.0.0.1:3010:3000"

volumes:
  classroom_ready_pg:
  classroom_ready_uploads:
